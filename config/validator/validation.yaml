App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 100
                  groups: [create, edit]
        country:
            - NotBlank:
                  groups: [create, edit]
        latitude:
            - NotNull:
                  groups: [create, edit]
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        longitude:
            - NotNull:
                  groups: [create, edit]
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]
App\Entity\Measurement:
    properties:
        location:
            - NotNull:
                  groups: [create, edit]
        date:
            - NotNull:
                  groups: [create, edit]
        celsius:
            - NotNull:
                  groups: [create, edit]
            - Range:
                  min: -100
                  max: 40
                  groups: [create, edit]
